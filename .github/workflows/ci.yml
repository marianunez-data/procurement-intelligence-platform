name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      P2P_RAW_DIR: ${{ github.workspace }}/data/raw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements-ci.txt && pip install -e .
      - name: Generate fictional data
        run: python -m p2p.generator.export
      - name: Build and test the warehouse (dbt)
        run: cd warehouse && dbt build --profiles-dir .
      - name: Data, warehouse, metrics, simulation and guardrail tests
        run: python -m pytest -q tests/test_generator.py tests/test_warehouse.py tests/test_metrics.py tests/test_montecarlo.py tests/test_guardrails.py
